# qing.matto.top 站点（/etc/nginx/sites-available/qing）里点单相关的两段，放在 443 的 server 块里。
# 网址保持 /hiro-a12/：iPad 主屏幕上的图标和离线缓存都绑在这个路径上，改了要重新添加到主屏幕。

    # 订单同步接口 -> hiro-booth-api.service
    location ^~ /hiro-a12/api/ {
        proxy_pass http://127.0.0.1:19130/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        client_max_body_size 32k;
    }
    # iPad 点单页（静态 PWA），current 软链指向 releases/ 里的某一次部署
    location = /hiro-a12 { return 301 /hiro-a12/; }
    location ^~ /hiro-a12/ {
        alias /var/www/hiro-booth/current/;
        index index.html;
        try_files $uri $uri/ =404;
        location ~ \.(html|js|css)$ { add_header Cache-Control "no-cache"; }
        location ~ \.webmanifest$ { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
        location ~ \.(webp|png)$ { add_header Cache-Control "public, max-age=86400"; }
    }
