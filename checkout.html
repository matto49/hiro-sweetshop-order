<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf4" />
    <meta
      name="description"
      content="小広甜品铺独立结账页：核对制品，由服务端重新计算账单并生成现场核对订单号。"
    />
    <title>结账｜小広甜品铺</title>
    <link rel="icon" href="./assets/owl.png" />
    <link rel="stylesheet" href="./styles.css?v=20260822-3" />
    <link rel="stylesheet" href="./checkout.css?v=20260823-1" />
    <script type="module" src="./checkout.js?v=20260823-1"></script>
  </head>
  <body class="checkout-page">
    <header class="checkout-header">
      <a class="back-link" href="./index.html" aria-label="返回继续选购">← 继续选购</a>
      <div class="checkout-brand">
        <img src="./assets/papa-logo.png" alt="趴着的筱泽广" />
        <div>
          <p>IFE02 · F-3</p>
          <strong>小広甜品铺</strong>
        </div>
      </div>
      <span class="checkout-step">CHECKOUT</span>
    </header>

    <main class="checkout-shell">
      <section class="receipt-panel" aria-labelledby="checkout-title">
        <div class="checkout-title-row">
          <div>
            <p class="section-kicker">YOUR SWEET ORDER</p>
            <h1 id="checkout-title">核对点单票</h1>
          </div>
          <span id="checkout-count" class="count-chip">0 件</span>
        </div>

        <div id="checkout-items" class="checkout-items" aria-live="polite"></div>

        <div id="checkout-gift" class="checkout-gifts" hidden>
          <div class="checkout-gift" data-qualified="pickup">
            <span aria-hidden="true">✦</span>
            <div>
              <strong>现场可自取：KTN 10cm 方卡</strong>
              <p>不计入订单赠品资格，数量有限，领完为止。</p>
            </div>
          </div>
          <div id="checkout-bag-gift" class="checkout-gift" data-qualified="false">
            <span aria-hidden="true">♧</span>
            <div>
              <strong>小広甜品铺袋子无料</strong>
              <p id="checkout-bag-status">还差 20 元获得</p>
            </div>
          </div>
        </div>

        <div class="checkout-total">
          <span>服务端提交时会再次核价</span>
          <strong>合计 <b id="checkout-total">0</b><small> 元</small></strong>
        </div>
      </section>

      <aside class="submit-panel" aria-labelledby="submit-title">
        <div class="submit-heading">
          <span class="submit-number">02</span>
          <div>
            <p class="section-kicker">REVIEW & SUBMIT</p>
            <h2 id="submit-title">提交现场订单</h2>
          </div>
        </div>

        <p class="submit-intro">
          核对制品与数量后直接提交。服务端会重新计算金额和袋子无料资格，并生成现场核对订单号；本页不处理付款。
        </p>

        <form id="order-form">
          <button id="submit-order" class="submit-order" type="submit" disabled>
            <span>提交订单</span>
            <small>生成现场核对编号</small>
          </button>
        </form>

        <section id="order-result" class="order-result" aria-live="polite" hidden>
          <p>订单已提交</p>
          <strong id="order-number"></strong>
          <span id="order-result-summary"></span>
          <small>请保留这个页面，现场向摊主出示订单号。</small>
        </section>

        <p id="submit-error" class="submit-error" role="alert" hidden></p>
      </aside>
    </main>

    <footer class="checkout-footer">
      <img src="./assets/owl.png" alt="" />
      <p>不收集姓名、手机号等个人信息。订单金额由后端根据商品 ID 与数量重新计算。</p>
    </footer>
  </body>
</html>
