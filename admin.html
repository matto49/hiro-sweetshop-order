<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fffaf4" />
    <title>库存后台｜小広甜品铺</title>
    <link rel="icon" href="./assets/owl.png" />
    <link rel="stylesheet" href="./styles.css?v=20260822-3" />
    <link rel="stylesheet" href="./admin.css?v=20260823-1" />
    <script type="module" src="./admin.js?v=20260823-1"></script>
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <div>
        <p>IFE02 · F-3</p>
        <h1>库存后台</h1>
        <span>小広甜品铺</span>
      </div>
      <img src="./assets/owl.png" alt="" />
    </header>

    <main class="admin-shell">
      <section class="admin-auth" aria-labelledby="admin-auth-title">
        <div>
          <p class="section-kicker">ADMIN ACCESS</p>
          <h2 id="admin-auth-title">连接库存服务</h2>
          <p>管理口令只保留在当前标签页；关闭页面后需要重新输入。</p>
        </div>
        <form id="admin-auth-form">
          <label for="admin-token">管理口令</label>
          <div>
            <input id="admin-token" name="token" type="password" autocomplete="current-password" required />
            <button type="submit">连接</button>
          </div>
        </form>
      </section>

      <section class="admin-inventory" aria-labelledby="inventory-title">
        <div class="admin-section-heading">
          <div>
            <p class="section-kicker">LIVE INVENTORY</p>
            <h2 id="inventory-title">商品售卖状态</h2>
          </div>
          <p id="stock-updated" role="status">正在读取库存…</p>
        </div>
        <div id="admin-products" class="admin-products" aria-live="polite"></div>
      </section>

      <p id="admin-message" class="admin-message" role="alert" hidden></p>
    </main>
  </body>
</html>
